<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%" role="img" aria-labelledby="t">
  <title id="t">Illustration: memorized bits rising then plateauing as training data grows</title>
  <rect width="400" height="180" fill="none"/>
  <line x1="40" y1="20" x2="40" y2="150" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="40" y1="150" x2="380" y2="150" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="40" y1="55" x2="380" y2="55" stroke="currentColor" stroke-width="1" stroke-dasharray="4 5" opacity="0.4"/>
  <path d="M40,150 C90,120 120,60 180,56 C260,52 320,54 380,55" fill="none" stroke="#a3341f" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="180" cy="57" r="4.5" fill="#a3341f"/>
  <text x="44" y="46" font-family="sans-serif" font-size="11" fill="currentColor" opacity="0.6">capacity ceiling</text>
  <text x="300" y="168" font-family="sans-serif" font-size="11" fill="currentColor" opacity="0.6">training set size</text>
</svg>
